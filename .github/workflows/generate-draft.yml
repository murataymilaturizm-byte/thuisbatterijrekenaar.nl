name: Wekelijks concept genereren

on:
  schedule:
    # Elke maandag 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Twee gelijktijdige runs zouden naar dezelfde conceptbranch schrijven.
concurrency:
  group: concept-generatie
  cancel-in-progress: false

jobs:
  concept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # De bottleneck is de beoordeling, niet de productie. Staat er nog een
      # concept open, dan levert een nieuwe run twee dingen op die niemand wil:
      # een tweede ongelezen taslak, en — als het hetzelfde onderwerp is — een
      # force-push over de vorige heen. Dat laatste is op 19 oktober 2026
      # gebeurd: de wachtrijstatus staat alleen op de conceptbranch, dus main
      # koos levensduur een week later opnieuw en overschreef het concept van
      # 12 oktober. Geen fout dus, maar een reden om te wachten: exit 0.
      - name: Open concept? Dan niet genereren
        id: wachten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh heeft jq ingebouwd (--jq); geen externe jq nodig.
          jq_filter='.[] | select(.headRefName | startswith("concept/")) | "- #\(.number) \(.title) — branch \(.headRefName), open sinds \(.createdAt[0:10])"'
          open=$(gh pr list --state open --limit 50 --json number,title,headRefName,createdAt --jq "$jq_filter")
          if [ -z "$open" ]; then
            echo "blokkeer=0" >> "$GITHUB_OUTPUT"
            echo "Geen open concept-PR; we genereren." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "blokkeer=1" >> "$GITHUB_OUTPUT"
          {
            echo "## Niet gegenereerd: vorig concept nog in beoordeling"
            echo
            echo "De beoordeling is de bottleneck. Zolang hieronder een PR open"
            echo "staat, levert een nieuwe run alleen een tweede ongelezen concept"
            echo "op — en bij hetzelfde onderwerp een force-push over het vorige"
            echo "heen."
            echo
            echo "$open"
            echo
            echo "Merge of sluit die PR; de volgende run pakt de wachtrij weer op."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Niet gegenereerd — nog open concept-PR:"
          echo "$open"

      - name: Concept genereren
        id: genereer
        if: steps.wachten.outputs.blokkeer == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # pipefail: zonder dit levert `node ... | tee` de exitcode van tee (0),
          # waardoor een ontbrekende sleutel of API-fout een groene run zou geven.
          set -o pipefail
          node scripts/generate-draft.mjs | tee uitvoer.log
          echo "slug=$(grep -oP '(?<=^\[generate-draft\] SLUG=).*' uitvoer.log || true)" >> "$GITHUB_OUTPUT"
          echo "titel=$(grep -oP '(?<=^\[generate-draft\] TITEL=).*' uitvoer.log || true)" >> "$GITHUB_OUTPUT"
          rm uitvoer.log

      # Lege wachtrij of overgeslagen onderwerp: geen slug, dus stil stoppen.
      - name: Pull request openen
        if: steps.wachten.outputs.blokkeer == '0' && steps.genereer.outputs.slug != ''
        uses: peter-evans/create-pull-request@v6
        with:
          branch: concept/${{ steps.genereer.outputs.slug }}
          title: 'Concept: ${{ steps.genereer.outputs.titel }}'
          commit-message: 'Concept: ${{ steps.genereer.outputs.titel }}'
          body: |
            Automatisch gegenereerd concept — **nog niet gepubliceerd**
            (`published: false`, bestandsnaam begint met `_`).

            Ter beoordeling:
            1. Lees het concept op `/concepten` (draai `npm run dev` lokaal, of
               bekijk de Vercel-preview van deze PR).
            2. Controleer de kwaliteitspoorten op diezelfde pagina — rode
               punten moeten opgelost zijn vóór publicatie.
            3. Controleer elke `[TEYIT GEREKLI]`-markering en vervang die door
               geverifieerde tekst óf een eerlijke formulering.

            Publiceren (zie README, "Contentpijplijn"):
            `published: true`, `_`-prefix uit de bestandsnaam halen,
            routepagina in `src/pages/` aanmaken, dan pas mergen.
          labels: concept
